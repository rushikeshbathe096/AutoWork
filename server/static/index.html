<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="autowork-token" content="__AUTOWORK_TOKEN__">
<title>AutoWork</title>
<style>
:root{--bg:#0b1020;--panel:#121a2e;--line:#22304f;--text:#e6ebf5;--muted:#8b98b5;--accent:#6ea8fe;--ok:#3ecf8e;--bad:#ff6b6b;--warn:#f5b945;--human:#c792ea}
*{box-sizing:border-box}
body{margin:0;font:14px/1.45 system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text)}
header{display:flex;align-items:center;gap:12px;padding:12px 20px;border-bottom:1px solid var(--line)}
header h1{font-size:17px;margin:0} header span{color:var(--muted)}
.grid{display:grid;grid-template-columns:330px 1fr 440px;gap:14px;padding:14px;height:calc(100vh - 52px)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;overflow:auto}
h2{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:4px 0 10px}
textarea,select,input[type=text]{width:100%;background:#0d1426;color:var(--text);border:1px solid var(--line);border-radius:6px;padding:8px;font:inherit}
textarea{min-height:110px;resize:vertical}
button{background:var(--accent);color:#08101f;border:0;border-radius:6px;padding:8px 14px;font-weight:600;cursor:pointer}
button.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
button:disabled{opacity:.5;cursor:default}
.preset{display:block;width:100%;text-align:left;margin:6px 0;font-weight:400;font-size:13px}
.row{display:flex;gap:8px;align-items:center;margin:8px 0} .row label{color:var(--muted)}
.ev{border-left:3px solid var(--line);padding:6px 10px;margin:6px 0;background:#0e1629;border-radius:0 6px 6px 0;white-space:pre-wrap;word-break:break-word}
.ev .k{font-size:11px;text-transform:uppercase;color:var(--muted);letter-spacing:.05em}
.ev.thought{border-color:#5c6b8f} .ev.action{border-color:var(--accent)} .ev.obs-ok{border-color:#2b3d63;color:#aab6d3;font-size:12px}
.ev.obs-bad{border-color:var(--bad);font-size:12px} .ev.warning,.ev.error,.ev.llm_retry{border-color:var(--warn)}
.ev.human_request,.ev.human_response,.ev.policy{border-color:var(--human)} .ev.verify{border-color:var(--ok)}
.ev.plan{border-color:#4fd1c5} .ev.final{border-color:var(--ok)}
.ev details summary{cursor:pointer;color:var(--muted)}
.shot{width:100%;border:1px solid var(--line);border-radius:6px;background:#fff;cursor:zoom-in}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:13px} .kv b{color:var(--muted);font-weight:500}
.badge{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;font-weight:600}
.verified{background:#12392b;color:var(--ok)} .failed,.error,.budget_exhausted{background:#3d1717;color:var(--bad)}
.unverified,.needs_user{background:#3b2f12;color:var(--warn)} .running{background:#172a4d;color:var(--accent)}
#ask{display:none;border:2px solid var(--human);background:#1d1630;border-radius:10px;padding:12px;margin-bottom:12px}
#ask h3{margin:0 0 6px;color:var(--human);font-size:14px} .pre{white-space:pre-wrap}
.runs a{color:var(--text);text-decoration:none;display:block;padding:4px 0;font-size:12px;border-bottom:1px solid var(--line)}
.muted{color:var(--muted)} ul{padding-left:18px;margin:4px 0}
@media (max-width:1100px){.grid{grid-template-columns:1fr;height:auto}}
</style>
</head>
<body>
<header><h1>AutoWork</h1><span>autonomous task worker: real browser, real apps, verified outcomes</span><span id="status" style="margin-left:auto"></span></header>
<div class="grid">
  <div class="panel">
    <h2>Task</h2>
    <textarea id="task" placeholder="Describe what you need done…">Find the latest invoice from Acme, extract the amount and due date, enter it into our ERP, and tell me once it is done.</textarea>
    <div class="row"><label>Mode</label><select id="mode"><option value="balanced">balanced: approve irreversible actions</option><option value="supervised">supervised: approve every data change</option><option value="autonomous">autonomous: no approvals</option></select></div>
    <div class="row"><input type="checkbox" id="reset" checked><label for="reset">Reset simulated world first</label></div>
    <div class="row"><input type="checkbox" id="pb"><label for="pb">Use learned playbook</label></div>
    <h2 style="margin-top:12px">Inject faults</h2>
    <div class="row"><input type="checkbox" id="f1"><label for="f1">Vendor portal login fails once (503)</label></div>
    <div class="row"><input type="checkbox" id="f2"><label for="f2">ERP save times out (504) but saves</label></div>
    <div class="row"><input type="checkbox" id="f3"><label for="f3">ERP session expires after 3 views</label></div>
    <div class="row"><button id="go">Run task</button><button class="ghost" id="clearpb" title="Forget learned notes">Clear playbook</button></div>
    <h2 style="margin-top:14px">Example tasks</h2>
    <div id="presets"></div>
    <h2 style="margin-top:14px">Past runs</h2>
    <div class="runs" id="runs"></div>
  </div>
  <div class="panel" id="timelinePanel">
    <div id="ask"></div>
    <h2>Execution timeline</h2>
    <div id="timeline" class="muted">Start a task to see the agent work.</div>
  </div>
  <div class="panel">
    <h2>Live browser</h2>
    <img id="shot" class="shot" alt="latest screenshot" style="display:none">
    <div id="shotcap" class="muted" style="font-size:12px;margin:4px 0 12px"></div>
    <h2>Plan</h2><div id="plan" class="muted">-</div>
    <h2 style="margin-top:12px">Working memory</h2><div id="memory" class="kv muted">-</div>
    <h2 style="margin-top:12px">Result</h2><div id="result" class="muted">-</div>
    <h2 style="margin-top:12px">Learned playbook</h2><div id="playbook" class="muted" style="font-size:12px">-</div>
  </div>
</div>
<script>
// SECURITY: everything shown here (page text, emails, LLM output, tool args) is untrusted.
// It is only ever inserted with textContent via el(); innerHTML is never used.
const TOKEN = document.querySelector('meta[name="autowork-token"]').content;
const PRESETS = [
  "Find the latest invoice from Acme, extract the amount and due date, enter it into our ERP, and tell me once it is done.",
  "Enter the Globex invoice from my email into the ERP.",
  "Enter the Initech invoice into the ERP.",
  "Our CFO emailed about a vendor contact change. Make sure the ERP reflects it.",
  "Enter all bills from q3_expenses.csv in the workspace into the ERP, skipping any that already exist.",
  "Pay the latest Acme invoice in the ERP.",
  "Which open ERP bill is due soonest? Write a short summary of all open bills to open_bills.md in the workspace.",
];
const STATUSES = new Set(['verified','unverified','failed','needs_user','budget_exhausted','error','running']);
const $ = id => document.getElementById(id);
function el(tag, cls, ...kids){
  const e = document.createElement(tag); if (cls) e.className = cls;
  for (const k of kids) { if (k == null) continue; e.append(k instanceof Node ? k : document.createTextNode(String(k))); }
  return e;
}
const badge = st => el('span', 'badge ' + (STATUSES.has(st) ? st : 'error'), st);
const clear = (id, placeholder) => { const n=$(id); n.replaceChildren(); if (placeholder!==undefined){ n.append(placeholder); n.classList.add('muted'); } else n.classList.remove('muted'); return n; };
const api = (url, opts={}) => fetch(url, {...opts, headers: {'Content-Type':'application/json','X-AutoWork-Token':TOKEN, ...(opts.headers||{})}});
PRESETS.forEach(p => { const b = el('button','ghost preset',p); b.onclick=()=>$('task').value=p; $('presets').append(b); });
let es, runId;

function add(cls, kind, ...body){
  const t=$('timeline'); if (t.classList.contains('muted')) clear('timeline');
  t.append(el('div','ev '+cls, el('div','k',kind), ...body)); $('timelinePanel').scrollTop=1e9;
}
function details(summary, full){ const d=el('details',null, el('summary',null,summary)); d.append(full); return d; }
function shot(p, cap){ if(!p) return; $('shot').src='/files/'+encodeURI(p); $('shot').style.display='block'; $('shotcap').textContent=cap||''; }
$('shot').onclick=()=>window.open($('shot').src);
const list = (tag, items) => { const l=el(tag); (items||[]).forEach(x=>l.append(el('li',null,x))); return l; };

function handle(e){
  const d=e.data;
  switch(e.type){
    case 'start': clear('status').append(badge('running'), ` ${d.model} · ${d.mode}`); add('plan','start',d.task); break;
    case 'plan':
      clear('plan').append(el('b',null,d.goal), list('ol',d.plan), el('div','muted','Success criteria:'), list('ul',d.success_criteria));
      add('plan','plan', d.goal, (d.assumptions||[]).length ? el('div','muted','Assumptions: '+d.assumptions.join('; ')) : null); break;
    case 'thought': add('thought',`step ${d.step} · reasoning`, d.text); break;
    case 'action': add('action',`step ${d.step} · action`, el('b',null,d.tool), ' ', d.args); break;
    case 'observation':
      add(d.ok?'obs-ok':'obs-bad', d.ok?'observation':'observation · failed', details(d.text.split('\n').slice(0,3).join('\n'), d.text));
      shot(d.screenshot, `step ${d.step} · ${d.tool}`); break;
    case 'memory': { const m=clear('memory'); Object.entries(d).forEach(([k,v])=>m.append(el('b',null,k), el('span',null,v))); break; }
    case 'policy': add('policy','policy gate', `${d.verdict}: ${d.reason}`); break;
    case 'human_request': add('human_request','asking human · '+d.kind, d.question); if(d.screenshot) shot(d.screenshot,'page awaiting approval'); break;
    case 'waiting_for_human': showAsk(d); break;
    case 'human_response': $('ask').style.display='none'; add('human_response','human answered', d.answer ?? ((d.approved?'APPROVED':'DENIED')+(d.comment?': '+d.comment:''))); break;
    case 'warning': case 'error': case 'llm_retry': add(e.type, e.type, (d.message||'') + (d.reason ? '\n'+d.reason : '')); break;
    case 'verify_start': add('verify','independent verification','Auditor (fresh context, read-only browser) is checking the real system state…'); break;
    case 'verify_step': add('verify','auditor · '+d.tool, details(d.args, d.text)); shot(d.screenshot,'auditor view'); break;
    case 'verify_result': add('verify', d.passed?'verification PASSED':'verification FAILED', d.reason+'\n'+(d.evidence||[]).join('\n')); break;
    case 'learned': add('plan','learned for next time', (d.notes||[]).join('\n')); loadPlaybook(); break;
    case 'final':
      clear('status').append(badge(d.status), ` ${d.steps} steps · ${d.duration_s}s · ${d.llm.calls} LLM calls`);
      clear('result').append(badge(d.status), el('p',null,d.summary), list('ul',d.evidence), d.verification ? el('div','muted','Audit: '+d.verification.reason) : null);
      add('final','final · '+d.status, d.summary); $('go').disabled=false; loadRuns(); break;
  }
}
function showAsk(d){
  const a=$('ask'); a.replaceChildren(); a.style.display='block';
  a.append(el('h3',null, d.kind==='approval' ? 'Approval required' : 'The agent needs your input'), el('div','pre', d.question));
  if (d.kind==='approval'){
    const cmt=el('input'); cmt.type='text'; cmt.placeholder='optional comment'; cmt.style.margin='8px 0';
    const yes=el('button',null,'Approve'), no=el('button','ghost','Deny');
    yes.onclick=()=>respond({qid:d.qid,approved:true,comment:cmt.value});
    no.onclick=()=>respond({qid:d.qid,approved:false,comment:cmt.value});
    a.append(cmt, el('div','row',yes,no));
  } else {
    const opts=el('div','row'); (d.options||[]).forEach(o=>{const b=el('button','ghost',o); b.onclick=()=>respond({qid:d.qid,answer:o}); opts.append(b)});
    const ans=el('input'); ans.type='text'; ans.placeholder='your answer';
    const send=el('button',null,'Send'); send.onclick=()=>respond({qid:d.qid,answer:ans.value});
    a.append(opts, ans, el('div','row',send));
  }
  a.scrollIntoView();
}
async function respond(body){ await api(`/api/runs/${encodeURIComponent(runId)}/answer`,{method:'POST',body:JSON.stringify(body)}); }
function watch(id){
  runId=id; if(es) es.close();
  ['timeline','plan','memory','result'].forEach(x=>clear(x,'-')); $('shot').style.display='none';
  es=new EventSource(`/api/runs/${encodeURIComponent(id)}/events`); es.onmessage=m=>handle(JSON.parse(m.data)); es.onerror=()=>es.close();
}
$('go').onclick=async()=>{
  const faults={acme_login_flaky:$('f1').checked, erp_submit_timeout:$('f2').checked, erp_session_expiry:$('f3').checked?3:0};
  $('go').disabled=true;
  const r=await api('/api/runs',{method:'POST',body:JSON.stringify({task:$('task').value,mode:$('mode').value,use_playbook:$('pb').checked,reset_world:$('reset').checked,faults})});
  const j=await r.json(); if(!r.ok){alert(typeof j.detail==='string'?j.detail:JSON.stringify(j.detail));$('go').disabled=false;return} watch(j.run_id);
};
$('clearpb').onclick=async()=>{await api('/api/playbook',{method:'DELETE'}); loadPlaybook()};
async function loadRuns(){
  const r=await (await fetch('/api/runs')).json(); const box=clear('runs');
  if(!r.length){ box.append(el('span','muted','none')); return; }
  r.forEach(x=>{ const a=el('a',null,badge(x.status),' ',x.task.slice(0,60)); a.href='#'; a.onclick=ev=>{ev.preventDefault();watch(x.run_id)}; box.append(a); });
}
async function loadPlaybook(){
  const p=await (await fetch('/api/playbook')).json();
  if(p.length) clear('playbook').append(list('ul',p.map(n=>n.note))); else clear('playbook','(empty: notes appear after a verified run)');
}
loadRuns(); loadPlaybook();
</script>
</body>
</html>
